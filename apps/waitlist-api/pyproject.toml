[project]
name = "cluely-os-waitlist-api"
version = "0.1.0"
description = "Waitlist API for Cluely OS landing page"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
